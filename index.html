<style>
  :root {
    --black:#0D0806; --white:#FFFFFF;
    --mocca:#BEA8A1; --light-mocca:#D3C4BF; --grey-50:#868483;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--black); color:var(--white);
    font-family:"Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    padding:48px 64px; position:relative; overflow:hidden;
  }
  .rings { position:absolute; top:-240px; right:-240px; width:800px; height:800px; pointer-events:none; }
  header svg { height:40px; width:auto; display:block; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:720px; position:relative; z-index:1; padding:64px 0; }
  .tag { font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--mocca); margin-bottom:24px; }
  h1 { font-family:"Comfortaa", sans-serif; font-weight:700; letter-spacing:-0.03em;
       font-size:clamp(40px, 7vw, 72px); line-height:1.1; margin-bottom:32px; text-wrap:balance; }
  p { font-size:18px; line-height:1.6; color:var(--light-mocca); max-width:560px; }
  p + p { margin-top:16px; }
  footer { font-size:14px; color:var(--grey-50); position:relative; z-index:1; }
  @media (max-width:600px) {
    body { padding:32px 24px; }
    header svg { height:32px; }
    .rings { width:480px; height:480px; top:-160px; right:-200px; }
    p { font-size:16px; }
  }
</style>
</head>
