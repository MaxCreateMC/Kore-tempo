<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kore Wellness — Site en maintenance</title>
<style>
  :root { --bg:#f6f3ee; --text:#2b2a28; --muted:#6f6b64; --line:#d9d3c9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  main { max-width:560px; }
  .brand { font-size:14px; letter-spacing:.35em; text-transform:uppercase; color:var(--muted); margin-bottom:40px; }
  h1 { font-weight:normal; font-size:clamp(28px, 6vw, 40px); line-height:1.2; margin-bottom:24px; }
  p { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size:17px; line-height:1.6; color:var(--muted); }
  hr { border:0; border-top:1px solid var(--line); width:60px; margin:32px auto; }
</style>
</head>
<body>
<main>
  <div class="brand">Kore Wellness</div>
  <h1>Notre site fait peau neuve</h1>
  <p>Le site est actuellement en maintenance pour évolution.<br>Il sera de nouveau accessible très prochainement.</p>
  <hr>
  <p>Merci de votre patience et à très bientôt.</p>
</main>
</body>
</html>
